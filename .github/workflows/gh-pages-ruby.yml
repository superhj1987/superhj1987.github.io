# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: My Blog Github Pages

on:
  push:
    branches: [ "source" ]
  pull_request:
    branches: [ "source" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        ruby-version: ['2.4']

    steps:
    - uses: actions/checkout@v3
      with:
        ref: source
    - name: Set up Ruby
      uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Generate pages
      shell: bash
      run: |
        set -o pipefail
        if ! bundle exec rake generate 2>&1 | tee /tmp/blog-build.log; then
          tail -n 30 /tmp/blog-build.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            echo "::error title=Site generation failed::$line"
          done
          exit 1
        fi
    - name: Verify publish output
      shell: bash
      run: |
        test -s public/index.html
        test -s public/CNAME
        cmp source/CNAME public/CNAME
        test -s public/stylesheets/screen.css
        test -s public/atom.xml
    - name: Deploy pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: master
